[package]
name = "skate-game"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "skate3rust"
path = "src/main.rs"

[[bin]]
name = "skate3-audio-check"
path = "src/audio_check_main.rs"
test = false

[[bin]]
name = "skate3-multiplayer"
path = "src/multiplayer_main.rs"
test = false

[[bin]]
name = "skate3-custom-models"
path = "src/custom_models_main.rs"
test = false

[features]
default = ["dev-dynamic"]
dev-dynamic = ["bevy/dynamic_linking"]

[dependencies]
bevy = { workspace = true, features = ["jpeg"] }
skate-vfs.workspace = true
tracing-log = "0.2"
skate-core.workspace = true
skate-data.workspace = true
skate-audio-formats.workspace = true
half = "=2.7.1"
serde_json.workspace = true
serde.workspace = true
skate-mods = { path = "../skate-mods" }

skate-vehicles = { path = "../skate-vehicles" }
skate-net = { path = "../skate-net" }
blake3 = "=1.8.7"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
# MW2 mode: IW4L's no_std IW4 movement (Apache-2.0), pinned to the andrewnakas/mw2-skate-web fork.
movement_iw4 = { git = "https://github.com/andrewnakas/mw2-skate-web", rev = "f608f85e407ff1b7689d54a9aafdd16e95711ac4" }
playerstate_iw4 = { git = "https://github.com/andrewnakas/mw2-skate-web", rev = "f608f85e407ff1b7689d54a9aafdd16e95711ac4" }
trace_iw4 = { git = "https://github.com/andrewnakas/mw2-skate-web", rev = "f608f85e407ff1b7689d54a9aafdd16e95711ac4" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The retail-exact player audio emulates an x86_64 guest; the web build has its own driver.
skate-audio-core.workspace = true
bevy = { workspace = true, features = ["trace", "debug"] }

# Web: WebGPU only, pack bytes handed over from JavaScript.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["webgpu"] }
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = ["console"] }
console_error_panic_hook = "=0.1.7"

[dev-dependencies]
naga = { version = "=27.0.3", features = ["wgsl-in"] }
naga_oil = { version = "=0.20.0", default-features = false }
wgpu = { version = "=27.0.1", default-features = false, features = ["vulkan", "naga-ir"] }
