name: Web build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.127
      - name: Build wasm
        run: cargo build -p skate-game --bin skate3rust --profile web --target wasm32-unknown-unknown --no-default-features
      - name: Assemble site
        run: |
          mkdir -p site
          wasm-bindgen --target web --no-typescript --out-dir site --out-name skate3rust target/wasm32-unknown-unknown/web/skate3rust.wasm
          cp web/* site/
          # Clean-room MW2 maps (games/mw2 in skate3-cleanroom; taint 0 before commit).
          mkdir -p site/maps/mw2
          cp maps/mw2/*.skate site/maps/mw2/ 2>/dev/null || true
          python3 -c "import json,os,glob; print(json.dumps([{'title': os.path.basename(p)[:-6], 'file': p[5:], 'size': os.path.getsize(p)} for p in sorted(glob.glob('site/maps/mw2/*.skate'))]))" > site/mw2maps.json
          cat site/mw2maps.json
          touch site/.nojekyll
          ls -la site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  map-writer:
    # tools/mesh_to_skate.py output must parse with the engine's own reader.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pillow
      - name: Write and read back a demo map
        run: |
          python tools/mesh_to_skate.py --demo /tmp/demo
          python tools/mesh_to_skate.py /tmp/demo /tmp/demo.skate
          cargo run -q -p skate-data --example inspect_skate -- /tmp/demo.skate
  pages:
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
